services:
  # PostgreSQL database
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gutguide}
      POSTGRES_USER: ${POSTGRES_USER:-gutguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gut-guide-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gutguide} -d ${POSTGRES_DB:-gutguide}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot backend
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-gutguide}
      DATABASE_USERNAME: ${POSTGRES_USER:-gutguide}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
    networks:
      - gut-guide-net
    depends_on:
      db:
        condition: service_healthy

  # Angular frontend (served by Nginx)
  frontend:
    build: ./frontend
    restart: unless-stopped
    networks:
      - gut-guide-net

  # Caddy reverse proxy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gut-guide-net
    depends_on:
      - backend
      - frontend

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    networks:
      - gut-guide-net
    depends_on:
      - caddy

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  gut-guide-net:
    driver: bridge
