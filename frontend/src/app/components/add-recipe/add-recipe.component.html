<div class="recipe-container">
  <h2>{{ isEditMode ? 'Edit Recipe' : 'Add New Recipe' }}</h2>

  <form [formGroup]="recipeForm" (ngSubmit)="onSubmit()">
    
    <!-- Basic Info Section -->
    <div class="form-section">
      <div class="form-group">
        <label for="name">Recipe Name</label>
        <input id="name" type="text" formControlName="name" placeholder="e.g. Spaghetti Bolognese">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="servings">Servings</label>
          <input id="servings" type="number" formControlName="servings" min="1">
        </div>
        <div class="form-group">
          <label for="timeToCook">Time (mins)</label>
          <input id="timeToCook" type="number" formControlName="timeToCook">
        </div>
        <div class="form-group">
          <label for="calories">Calories</label>
          <input id="calories" type="number" formControlName="calories">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="mealType">Meal Type</label>
          <input id="mealType" type="text" formControlName="mealType" placeholder="e.g. Dinner">
        </div>
        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" formControlName="fullMeal"> Full Meal
          </label>
          <label>
            <input type="checkbox" formControlName="tried"> Tried Before
          </label>
        </div>
      </div>
    </div>

    <!-- Ingredients Section -->
    <div class="form-section">
      <h3>Ingredients</h3>
      <div formArrayName="ingredients">
        <div *ngFor="let ingredient of ingredients.controls; let i = index" [formGroupName]="i" class="ingredient-row">
          
          <div class="form-group grow-2">
            <input type="text" formControlName="name" placeholder="Ingredient Name">
          </div>
          
          <div class="form-group">
            <!-- Decimal incrementer using step="0.1" -->
            <input type="number" formControlName="quantity" placeholder="Qty" step="0.1" min="0">
          </div>
          
          <div class="form-group">
            <select formControlName="unit">
              <option *ngFor="let u of units" [value]="u">{{ u }}</option>
            </select>
          </div>

          <button type="button" class="btn-remove" (click)="removeIngredient(i)" title="Remove Ingredient">
            &times;
          </button>
        </div>
      </div>
      <button type="button" class="btn-add" (click)="addIngredient()">+ Add Ingredient</button>
    </div>

    <!-- Instructions Section -->
    <div class="form-section">
      <h3>Instructions</h3>
      <div formArrayName="instructions">
        <div *ngFor="let instruction of instructions.controls; let i = index" class="instruction-row">
          <span class="step-number">{{ i + 1 }}.</span>
          <textarea [formControlName]="i" rows="2" placeholder="Describe this step..."></textarea>
          <button type="button" class="btn-remove" (click)="removeInstruction(i)" title="Remove Step">
            &times;
          </button>
        </div>
      </div>
      <button type="button" class="btn-add" (click)="addInstruction()">+ Add Step</button>
    </div>

    <!-- Additional Info -->
    <div class="form-section">
      <div class="form-group">
        <label for="comments">Comments</label>
        <textarea id="comments" formControlName="comments" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label for="source">Source (URL or Book)</label>
        <input id="source" type="text" formControlName="source">
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-save" [disabled]="recipeForm.invalid">Save Recipe</button>
    </div>
  </form>
</div>
